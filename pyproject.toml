[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawdbot"
version = "0.1.0"
description = "Minimal ClawdBot runtime and security tooling package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "click>=8.1",
  "tabulate>=0.9",
  "requests>=2.32",
  "cryptography>=44.0",
  "boto3>=1.35",
  "jinja2>=3.1", # FIX: C5-finding-3
  "networkx>=3.3", # FIX: C5-finding-3
  "psutil>=6.0", # FIX: C5-finding-3
]

[project.optional-dependencies]  # FIX: C6-RT-07
# PDF rendering for `openclaw-cli report weekly --pdf` (lazy-imported in src/clawdbot/report_weekly.py)
reporting = ["reportlab>=4.0"]  # FIX: C6-RT-07
# Test-only. flask is required to exercise the @read_only_io GET guard against a REAL
# Flask request context. Deliberately NOT a runtime dependency: this is a security
# playbook, not a web app, and the decorator lazy-imports flask inside its wrapper.
# Without this extra the two real-Flask tests importorskip away on every machine, which
# is one of the three reasons C6-RT-23 (a security control that was a no-op) survived an
# entire audit cycle unnoticed. Installed by the compliance-check security-tests job.
test = ["flask>=3.0"]  # FIX: C6-RT-23

[project.scripts]
openclaw-cli = "clawdbot.openclaw_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]  # FIX: C6-RT-09
testpaths = ["tests"]  # FIX: C6-RT-09 - collect only the maintained suite, not gitignored tmp/claude-home* reference checkouts
# Setting this ini key REPLACES pytest's built-in default list rather than extending it, so the
# defaults are restated verbatim here and only "tmp" is added. Dropping them would silently
# re-enable recursion into node_modules/venv/dot-dirs.  # FIX: C6-RT-09
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "tmp"]  # FIX: C6-RT-09 - pytest defaults + the local temp/reference checkout tree
