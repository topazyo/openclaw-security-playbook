name: Runtime Security Regression

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - 'scripts/verification/**'
      # FIX: C7-05b: configs/examples/docker-compose-full-stack.yml removed; nothing in this job reads it.
      - 'scripts/hardening/docker/seccomp-profiles/clawdbot.json' # FIX: C7-05b: runtime_security_regression.py:30,77
      - 'configs/organization-policies/security-policy.json' # FIX: C7-05b: Check 7, verify_openclaw_security.sh:392
      # FIX: C7-05b: Check 7 also requires this directory; a rename or move must run the pack. No other
      # FIX: C7-05b: workflow runs the verifier, so Detection Replay Validation does not cover it.
      - 'detections/sigma/**' # FIX: C7-05b
      - 'pyproject.toml' # FIX: C7-05b: [tool.pytest.ini_options] configures the harness unit-test step
      - 'tests/security/test_runtime_security_regression.py' # FIX: C6-RT-22
      - '.github/workflows/runtime-security-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-security-regression:
    name: Runtime Security Regression Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Capture runner delta
        run: |
          python scripts/verification/capture_runner_delta.py --output-dir "$RUNNER_TEMP/cycle3-runtime-evidence/runner-delta"

      - name: Run runtime harness unit tests
        run: |
          pytest tests/security/test_runtime_security_regression.py -v

      - name: Execute secure and insecure runtime pack
        run: |
          python scripts/verification/runtime_security_regression.py --scenario all --archive-root "$RUNNER_TEMP/cycle3-runtime-evidence"

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle3-runtime-evidence
          path: ${{ runner.temp }}/cycle3-runtime-evidence
          retention-days: 90